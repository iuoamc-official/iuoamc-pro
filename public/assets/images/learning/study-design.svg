<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">تصميم عاملي مبسّط 2 × 2</title><desc id="description">جدول لتقاطع وصفة مرجعية أو معدلة مع درجتي حرارة، بأربعة شروط دون نتائج.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">تصميم عاملي مبسّط 2 × 2</text><text x="440" y="101" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="700" fill="#17344d">عامل الوصفة</text><text x="240" y="144" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="22" font-weight="500" fill="#607484">وصفة مرجعية</text><text x="570" y="144" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="22" font-weight="500" fill="#607484">وصفة معدّلة</text><rect x="100" y="170" width="280" height="94" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="240" y="224" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">شرط 1</text><rect x="430" y="170" width="280" height="94" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="570" y="224" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">شرط 2</text><rect x="100" y="286" width="280" height="94" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="240" y="340" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">شرط 3</text><rect x="430" y="286" width="280" height="94" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="570" y="340" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">شرط 4</text><text x="797" y="206" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="21" font-weight="500" fill="#607484">حرارة أقل</text><text x="797" y="326" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="21" font-weight="500" fill="#607484">حرارة أعلى</text><text x="450" y="435" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#17344d">عاملان × مستويان = أربعة شروط تجريبية</text></g></svg>
