<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">كيف تتكوّن تجربة النكهة؟</title><desc id="description">أربع قنوات: الطعم والرائحة والملمس والسياق، تلتقي في الإدراك المتكامل.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">كيف تتكوّن تجربة النكهة؟</text><rect x="35" y="100" width="260" height="110" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="165" y="142" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="700" fill="#17344d">الطعم</text><text x="165" y="180" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="19" font-weight="500" fill="#607484">إشارات ذوقية</text><path d="M295,155 L360,215" fill="none" stroke="#217f81" stroke-width="3" marker-end="url(#arrow)"/><rect x="605" y="100" width="260" height="110" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="735" y="142" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="700" fill="#17344d">الرائحة</text><text x="735" y="180" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="19" font-weight="500" fill="#607484">شم عبر الأنف والفم</text><path d="M605,155 L540,215" fill="none" stroke="#217f81" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="270" width="260" height="110" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="165" y="312" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="700" fill="#17344d">الملمس والحرارة</text><text x="165" y="350" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="19" font-weight="500" fill="#607484">إحساس فموي</text><path d="M295,325 L360,265" fill="none" stroke="#217f81" stroke-width="3" marker-end="url(#arrow)"/><rect x="605" y="270" width="260" height="110" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="735" y="312" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="700" fill="#17344d">السياق والتوقع</text><text x="735" y="350" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="19" font-weight="500" fill="#607484">مظهر وخبرة سابقة</text><path d="M605,325 L540,265" fill="none" stroke="#217f81" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="240" r="89" fill="#17344d"/><text x="450" y="231" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="white">الإدراك</text><text x="450" y="267" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="white">المتكامل</text><text x="450" y="423" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#607484">نفصل القياس لنفهم التجربة المتكاملة</text></g></svg>
