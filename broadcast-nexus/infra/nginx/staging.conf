server {
    listen 80;
    server_name _;

    add_header X-IUOAMC-Environment "staging" always;
    add_header X-Production-Switching "false" always;
    add_header Cache-Control "no-store" always;

    location = /health {
        default_type application/json;
        return 200 '{"service":"staging-gateway","status":"ok","production_switching":false}';
    }

    # Public operator-session endpoints. The internal validator is never browser-routable.
    location = /auth-api/v1/session/exchange {
        proxy_pass http://operator-auth:8122/v1/session/exchange;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth-api/v1/session {
        proxy_pass http://operator-auth:8122/v1/session;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth-api/v1/session/logout {
        proxy_pass http://operator-auth:8122/v1/session/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /_session_validate {
        internal;
        proxy_pass http://operator-auth:8122/v1/session/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    location /dashboard-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://dashboard-api:8121/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /orchestrator-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://orchestrator:8100/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /scheduler-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://scheduler:8102/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /playout-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://playout:8103/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /encoder-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://encoder:8108/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /distribution-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://distribution:8109/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /iptv-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://iptv:8110/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /monitoring-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://monitoring:8111/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /alerts-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://alerts:8112/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /failover-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://failover:8113/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /noc-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://noc:8114/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /media-router-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://media-router:8105/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /rtc-gateway-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://rtc-gateway:8107/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /media-library-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://media-library:8101/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; client_max_body_size 2048m; proxy_request_buffering off; }
    location /live-studio-api/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://live-studio:8104/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }

    location /auth-control/ { proxy_pass http://dashboard-ui:80/auth/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /studio-control/ { proxy_pass http://dashboard-ui:80/studio/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /webrtc-control/ { proxy_pass http://dashboard-ui:80/webrtc/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /channels-control/ { proxy_pass http://dashboard-ui:80/channels/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /scheduler-control/ { proxy_pass http://dashboard-ui:80/scheduler/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /media-control/ { proxy_pass http://dashboard-ui:80/media/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /playout-control/ { proxy_pass http://dashboard-ui:80/playout/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /encoder-control/ { proxy_pass http://dashboard-ui:80/encoder/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /distribution-control/ { proxy_pass http://dashboard-ui:80/distribution/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /iptv-control/ { proxy_pass http://dashboard-ui:80/iptv/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /noc-control/ { proxy_pass http://dashboard-ui:80/noc/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /failover-control/ { proxy_pass http://dashboard-ui:80/failover/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /supervisor-control/ { proxy_pass http://dashboard-ui:80/supervisor/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /system-health/ { proxy_pass http://dashboard-ui:80/health/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location /supervisor/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://supervisor:8120/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; proxy_set_header X-IUOAMC-Environment staging; }
    location /noc/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://noc:8114/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; }
    location /control-room/ { auth_request /_session_validate; auth_request_set $session_authorization $upstream_http_authorization; proxy_pass http://control-room:8115/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $session_authorization; }

    location / { proxy_pass http://dashboard-ui:80/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
