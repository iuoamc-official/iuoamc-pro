<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">من الرقم إلى قوة الدليل</title><desc id="description">ثلاث نقاط مع مجالات عدم يقين رمزية لتوضيح أهمية قراءة التقدير وحدوده معًا.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">من الرقم إلى قوة الدليل</text><path d="M235,350 L800,350" fill="none" stroke="#17344d" stroke-width="3"/><text x="520" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#17344d">التقدير وحدود عدم اليقين</text><text x="130" y="159" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">تقدير أ</text><path d="M320,151 L580,151" fill="none" stroke="#217f81" stroke-width="3"/><path d="M320,141 L320,161" fill="none" stroke="#217f81" stroke-width="3"/><path d="M580,141 L580,161" fill="none" stroke="#217f81" stroke-width="3"/><circle cx="440" cy="151" r="9" fill="#b68b41"/><text x="130" y="239" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">تقدير ب</text><path d="M440,231 L705,231" fill="none" stroke="#217f81" stroke-width="3"/><path d="M440,221 L440,241" fill="none" stroke="#217f81" stroke-width="3"/><path d="M705,221 L705,241" fill="none" stroke="#217f81" stroke-width="3"/><circle cx="580" cy="231" r="9" fill="#b68b41"/><text x="130" y="319" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" font-weight="700" fill="#17344d">تقدير ج</text><path d="M380,311 L690,311" fill="none" stroke="#217f81" stroke-width="3"/><path d="M380,301 L380,321" fill="none" stroke="#217f81" stroke-width="3"/><path d="M690,301 L690,321" fill="none" stroke="#217f81" stroke-width="3"/><circle cx="555" cy="311" r="9" fill="#b68b41"/><text x="450" y="102" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="22" font-weight="500" fill="#607484">النقطة تقدير · الخط مجال عدم يقين رمزي</text><text x="450" y="442" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="18" font-weight="500" fill="#607484">لا تُفسَّر النقاط وحدها دون السؤال والتصميم</text></g></svg>
