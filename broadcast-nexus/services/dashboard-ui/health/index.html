<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IUOAMC System Health</title><style>body{margin:0;font-family:system-ui;background:#07111f;color:#eef4ff}.top{padding:18px 24px;border-bottom:1px solid #20324f;background:#081220;display:flex;justify-content:space-between}.wrap{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1a2d;border:1px solid #20324f;border-radius:14px;padding:14px;margin-bottom:14px}.kpi b{font-size:24px}.muted{color:#95a5bc}.ok{color:#7fe0bb}.bad{color:#ff9aa1}.warn{color:#f4c56d}.row{display:flex;justify-content:space-between;gap:12px;padding:9px;border-bottom:1px solid #1c2c45}.pill{padding:6px 9px;border:1px solid #2a3f61;border-radius:999px;font-size:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}}</style></head><body><header class="top"><div><b>IUOAMC System Health</b><div class="muted">Broadcast Nexus · Phase 30 · Staging only</div></div><div><span class="pill">PRODUCTION OUTPUTS OFF</span> <a href="/" style="color:#d6aa4b">Dashboard</a></div></header><main class="wrap"><div class="grid"><div class="card kpi"><div class="muted">Overall</div><b id="overall">—</b></div><div class="card kpi"><div class="muted">Services Up</div><b id="up">0</b></div><div class="card kpi"><div class="muted">Services Down</div><b id="down">0</b></div><div class="card kpi"><div class="muted">Safety</div><b id="safety">—</b></div></div><div class="two"><section class="card"><h3>Core Services</h3><div id="services" class="muted">Loading…</div></section><section class="card"><h3>Infrastructure</h3><div id="infra" class="muted">Loading…</div></section></div><div class="two"><section class="card"><h3>Broadcast State</h3><div id="broadcast" class="muted">Loading…</div></section><section class="card"><h3>Safety Envelope</h3><div id="safeDetail" class="muted">Loading…</div></section></div><section class="card"><div style="display:flex;justify-content:space-between"><h3>Refresh</h3><button onclick="loadHealth()">Refresh now</button></div><p id="stamp" class="muted">Waiting…</p></section></main><script>function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function cls(s){return s==='up'||s==='healthy'?'ok':s==='down'?'bad':'warn'}function rows(o){return Object.entries(o||{}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b class="${cls(typeof v==='string'?v:'')}">${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')||'<div class="muted">No data</div>'}async function loadHealth(){try{const r=await fetch('/dashboard-api/v1/system-health',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error('HTTP '+r.status);overall.textContent=d.overall.toUpperCase();overall.className=cls(d.overall);up.textContent=d.service_counts.up;down.textContent=d.service_counts.down;safety.textContent=d.safety.safe_for_staging?'SAFE':'UNSAFE';safety.className=d.safety.safe_for_staging?'ok':'bad';services.innerHTML=Object.entries(d.services).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b class="${cls(v.status)}">${esc(v.status)} · ${esc(v.latency_ms)} ms</b></div>`).join('');infra.innerHTML=rows(d.infrastructure);broadcast.innerHTML=rows(d.broadcast_state);safeDetail.innerHTML=rows(d.safety);stamp.textContent='Updated '+new Date(d.generated_at).toLocaleString()}catch(e){stamp.textContent=e.message;overall.textContent='ERROR';overall.className='bad'}}loadHealth();setInterval(loadHealth,10000);</script></body></html>
