logLevel: info
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

rtsp: yes
rtspAddress: :8554
rtmp: no

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ['*']

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
# For the isolated staging preview, carry ICE over one deterministic TCP port.
# SSH local forwarding transports TCP only, so advertising the default UDP ICE
# listener would leave the browser stuck at 0:00 even though the WebRTC page loads.
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]

srt: yes
srtAddress: :8890

paths:
  iuoamc-tv-4k:
    source: publisher
    overridePublisher: yes
