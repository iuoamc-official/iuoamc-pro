<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">الإحساس يتغير عبر الزمن</title><desc id="description">منحنيان افتراضيان يوضحان اختلاف ذروة الشدة ومدة الإحساس.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">الإحساس يتغير عبر الزمن</text><path d="M100,350 L790,350" fill="none" stroke="#17344d" stroke-width="3"/><path d="M100,350 L100,110" fill="none" stroke="#17344d" stroke-width="3"/><text x="445" y="403" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#17344d">الزمن بعد بداية التذوق</text><text x="150" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#17344d">الشدة</text><path d="M105,342 C180,340 190,122 280,143 S390,322 535,340 S700,343 780,343" fill="none" stroke="#217f81" stroke-width="5"/><path d="M105,344 C195,342 230,212 330,230 S455,295 560,291 S700,322 780,342" fill="none" stroke="#b68b41" stroke-width="5"/><text x="480" y="146" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="700" fill="#217f81">ذروة أعلى ومدة أقصر</text><text x="610" y="252" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="700" fill="#866223">ذروة أقل وبقاء أطول</text><text x="450" y="440" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="18" font-weight="500" fill="#607484">منحنيات توضيحية وليست نتائج قياس</text></g></svg>
