<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">تعمية العينات وموازنة الترتيب</title><desc id="description">ثلاث عينات برموز محايدة وتحتها أمثلة ترتيب ABC وBCA وCAB؛ خطة جزئية لتوضيح الفكرة.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">تعمية العينات وموازنة الترتيب</text><path d="M145,140 L161,235 Q210,255 259,235 L275,140 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="210" cy="140" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="210" y="203" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">417</text><path d="M385,140 L401,235 Q450,255 499,235 L515,140 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="450" cy="140" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="450" y="203" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">862</text><path d="M625,140 L641,235 Q690,255 739,235 L755,140 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="690" cy="140" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="690" y="203" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">295</text><text x="450" y="106" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="22" font-weight="500" fill="#607484">رموز محايدة لا تكشف هوية ا