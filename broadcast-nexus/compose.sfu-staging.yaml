services:
  rtc-gateway:
    environment:
      DEPLOYMENT_ENV: staging
      PRODUCTION_OUTPUTS_ENABLED: "false"
      PUBLIC_WEBRTC_INGRESS_ENABLED: "false"
      SFU_PROVIDER: ${SFU_PROVIDER:-loopback}
      SFU_ENABLED: ${SFU_ENABLED:-false}
      TURN_ENABLED: ${TURN_ENABLED:-false}
      SFU_INTERNAL_URL: ${SFU_INTERNAL_URL:-http://sfu:7880}
      TURN_INTERNAL_URL: ${TURN_INTERNAL_URL:-turn:turn:3478}
      SFU_API_KEY: ${SFU_API_KEY:-CHANGE_ME_SFU_API_KEY}
      SFU_API_SECRET: ${SFU_API_SECRET:-CHANGE_ME_SFU_API_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-CHANGE_ME_TURN_SHARED_SECRET}

  sfu:
    image: livekit/livekit-server:v1.9.2
    profiles: ["sfu-lab"]
    restart: "no"
    command:
      - --dev
      - --bind
      - 0.0.0.0
    ports:
      - "127.0.0.1:57880:7880"
      - "127.0.0.1:57881:7881"
      - "127.0.0.1:55000-55020:50000-50020/udp"
    networks: [default]

  turn:
    image: coturn/coturn:4.6.3-r3
    profiles: ["sfu-lab"]
    restart: "no"
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=iuoamc-staging.invalid
      - --user=staging:${TURN_SHARED_SECRET:-CHANGE_ME_TURN_SHARED_SECRET}
      - --min-port=49160
      - --max-port=49180
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "127.0.0.1:53478:3478/tcp"
      - "127.0.0.1:53478:3478/udp"
      - "127.0.0.1:49160-49180:49160-49180/udp"
    networks: [default]
