name: iuoamc_broadcast_nexus

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nexus_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - nexus_redis:/data

  nats:
    image: nats:2-alpine
    restart: "no"
    command: ["--jetstream", "--store_dir=/data", "--user", "${NATS_USER}", "--pass", "${NATS_PASSWORD}"]
    ports:
      - "127.0.0.1:54222:4222"
      - "127.0.0.1:58222:8222"
    volumes:
      - nexus_nats:/data

  minio:
    image: minio/minio:latest
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - nexus_minio:/data

volumes:
  nexus_postgres:
  nexus_redis:
  nexus_nats:
  nexus_minio:
