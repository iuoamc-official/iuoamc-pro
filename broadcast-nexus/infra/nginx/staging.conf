server {
    listen 80;
    server_name _;

    add_header X-IUOAMC-Environment "staging" always;
    add_header X-Production-Switching "false" always;
    add_header Cache-Control "no-store" always;

    location = /health {
        default_type application/json;
        return 200 '{"service":"staging-gateway","status":"ok","production_switching":false}';
    }

    location /dashboard-api/ {
        proxy_pass http://dashboard-api:8121/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-IUOAMC-Environment staging;
    }

    location /orchestrator-api/ {
        proxy_pass http://orchestrator:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-IUOAMC-Environment staging;
    }

    location /scheduler-api/ {
        proxy_pass http://scheduler:8102/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-IUOAMC-Environment staging;
    }

    location /live-studio-api/ {
        proxy_pass http://live-studio:8104/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-IUOAMC-Environment staging;
    }

    location /studio-control/ {
        proxy_pass http://dashboard-ui:80/studio/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /channels-control/ {
        proxy_pass http://dashboard-ui:80/channels/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /scheduler-control/ {
        proxy_pass http://dashboard-ui:80/scheduler/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /supervisor/ {
        proxy_pass http://supervisor:8120/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-IUOAMC-Environment staging;
    }

    location /noc/ {
        proxy_pass http://noc:8114/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /control-room/ {
        proxy_pass http://control-room:8115/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://dashboard-ui:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
