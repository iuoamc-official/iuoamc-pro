name: Broadcast Nexus CI

on:
  pull_request:
    paths:
      - 'broadcast-nexus/**'
      - '.github/workflows/broadcast-nexus-ci.yml'
  push:
    branches:
      - broadcast-nexus-foundation
    paths:
      - 'broadcast-nexus/**'
      - '.github/workflows/broadcast-nexus-ci.yml'

permissions:
  contents: read

concurrency:
  group: broadcast-nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: broadcast-nexus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare temporary CI environment
        run: |
          cp .env.example .env
          sed -i -E 's/CHANGE_ME_[A-Z0-9_]+/ci-local-placeholder-0123456789abcdef/g' .env

      - name: Security preflight
        run: bash scripts/security-preflight.sh

      - name: Remove temporary env before repository isolation tests
        run: rm -f .env

      - name: Python syntax validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = list(Path('services').rglob('*.py')) + list(Path('packages').rglob('*.py'))
          for f in files:
              py_compile.compile(str(f), doraise=True)
          print(f'Compiled {len(files)} Python files')
          PY

      - name: Install contract-test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Contract tests
        run: python -m pytest -q tests

      - name: Recreate temporary environment for Compose validation
        run: |
          cp .env.example .env
          sed -i -E 's/CHANGE_ME_[A-Z0-9_]+/ci-local-placeholder-0123456789abcdef/g' .env

      - name: Docker Compose configuration validation
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.noc.yaml \
            -f compose.shadow.yaml \
            -f compose.supervisor.yaml \
            config --quiet

      - name: Remove temporary environment
        if: always()
        run: rm -f .env

  no-production-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Explicit deployment guard
        run: |
          echo 'Broadcast Nexus CI validates only.'
          echo 'No staging or production deployment is performed by this workflow.'
