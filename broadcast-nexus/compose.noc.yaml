      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    ports: ["127.0.0.1:58112:8112"]
    depends_on:
      postgres: {condition: service_healthy}

  failover:
