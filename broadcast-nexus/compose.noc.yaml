      JWT_AUDIENCE: ${JWT_AUDIENCE}
    ports: ["127.0.0.1:58115:8115"]
    depends_on:
      postgres: {condition: service_healthy}

  noc-dashboard:
    build:
      context: ..
      dockerfile: broadcast-nexus/apps/noc-dashboard/Dockerfile
    restart: "no"
    ports: ["127.0.0.1:58116:80"]
    depends_on:
