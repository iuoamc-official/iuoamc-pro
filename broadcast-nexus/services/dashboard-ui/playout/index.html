<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IUOAMC Playout Control</title><style>body{font-family:Arial;background:#07111f;color:#eef4ff;margin:0;padding:22px}.card{background:#0d1a2d;border:1px solid #20324f;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select{background:#0c1930;color:#eef4ff;border:1px solid #2b4163;border-radius:8px;padding:9px}.btn{cursor:pointer}.warn{color:#f4c56d}.ok{color:#7fe0bb}.list{display:grid;gap:8px}.item{border:1px solid #20324f;border-radius:10px;padding:10px}.muted{color:#95a5bc;font-size:12px}pre{white-space:pre-wrap}</style></head><body><h1>Playout Control</h1><p class="warn">STAGING ONLY · PRODUCTION OUTPUT OFF · Encoder/Distribution activation disabled</p><div class="card"><div class="row"><input id="jwt" type="password" placeholder="Operator JWT"><button class="btn" onclick="connectP()">Connect</button><button class="btn" onclick="clearP()">Clear</button><span id="msg" class="muted">Disconnected</span></div></div><div class="card"><h3>Channel / Rundown</h3><div class="row"><select id="channel" onchange="loadRundowns()"><option value="">Select channel</option></select><select id="rundown"><option value="">Select rundown</option></select><button class="btn" onclick="compileRundown()">Compile Rundown</button><button class="btn" onclick="loadRuns()">Refresh Runs</button></div></div><div class="card"><h3>Runs</h3><div id="runs" class="list"><div class="muted">Connect first.</div></div></div><div class="card"><h3>Selected Run</h3><div id="detail" class="muted">No run selected.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="transitionRun('ready')">Ready</button><button class="btn" onclick="transitionRun('running')">Start</button><button class="btn" onclick="transitionRun('paused')">Pause</button><button class="btn" onclick="transitionRun('completed')">Complete</button><button class="btn" onclick="transitionRun('cancelled')">Cancel</button></div></div><div class="card"><h3>Fallback Preview</h3><div class="row"><select id="trigger"><option>missing_asset</option><option>source_timeout</option><option>decode_error</option><option>live_unavailable</option><option>manual</option></select><button class="btn" onclick="resolveFallback()">Resolve</button></div><pre id="fallback" class="muted"></pre></div><script>let token='',selectedRun=null;function h(json=true){const x={Authorization:'Bearer '+token};if(json)x['Content-Type']='application/json';return x}async function api(base,path,opts={}){if(!token)throw new Error('JWT required');const r=await fetch(base+path,{...opts,headers:{...h(opts.body!==undefined),...(opts.headers||{})},cache:'no-store'});let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(typeof d?.detail==='string'?d.detail:JSON.stringify(d?.detail||('HTTP '+r.status)));return d}function say(t,ok=true){const e=document.getElementById('msg');e.textContent=t;e.className=ok?'ok':'warn'}async function connectP(){token=document.getElementById('jwt').value.trim();document.getElementById('jwt').value='';if(!token)return say('JWT required',false);try{const c=await api('/orchestrator-api','/v1/channels');channel.innerHTML='<option value="">Select channel</option>'+c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');say('Connected')}catch(e){say(e.message,false)}}function clearP(){token='';selectedRun=null;say('Disconnected')}async function loadRundowns(){if(!channel.value)return;try{const r=await api('/scheduler-api',`/v1/channels/${channel.value}/rundowns`);rundown.innerHTML='<option value="">Select rundown</option>'+r.map(x=>`<option value="${x.id}">${x.name} · ${x.scheduled_date} · v${x.version}</option>`).join('');await loadRuns()}catch(e){say(e.message,false)}}async function compileRundown(){if(!rundown.value)return say('Select rundown',false);try{const r=await api('/playout-api','/v1/compile',{method:'POST',body:JSON.stringify({rundown_id:rundown.value})});say(`Compiled ${r.items??''} items · ${r.queue_hash.slice(0,12)}…`);await loadRuns()}catch(e){say(e.message,false)}}async function loadRuns(){if(!channel.value)return;try{const rows=await api('/playout-api',`/v1/channels/${channel.value}/runs`);runs.innerHTML=rows.length?rows.map(r=>`<div class="item" onclick="selectRun('${r.id}')"><b>${r.state.toUpperCase()}</b><div class="muted">${r.source_revision}<br>hash ${r.queue_hash.slice(0,16)}…</div></div>`).join(''):'<div class="muted">No runs.</div>'}catch(e){say(e.message,false)}}async function selectRun(id){selectedRun=id;try{const r=await api('/playout-api',`/v1/runs/${id}`);detail.innerHTML=`<b>${r.state.toUpperCase()}</b><div class="muted">Queue hash: ${r.queue_hash}<br>Items: ${r.items.length}<br>Source: ${r.source_revision}<br>Production output: false</div><div class="list">${r.items.map(i=>`<div class="item">#${i.ordinal} ${i.title} · ${i.item_type}</div>`).join('')}</div>`}catch(e){say(e.message,false)}}async function transitionRun(state){if(!selectedRun)return say('Select run',false);try{await api('/playout-api',`/v1/runs/${selectedRun}/transition`,{method:'POST',body:JSON.stringify({state,reason:'operator staging control'})});say('Run → '+state);await selectRun(selectedRun);await loadRuns()}catch(e){say(e.message,false)}}async function resolveFallback(){if(!channel.value)return say('Select channel',false);try{const r=await api('/playout-api','/v1/fallback/resolve',{method:'POST',body:JSON.stringify({channel_id:channel.value,trigger_type:trigger.value})});fallback.textContent=JSON.stringify(r,null,2)}catch(e){say(e.message,false)}}</script></body></html>
