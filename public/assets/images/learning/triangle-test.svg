<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description"><title id="title">منطق اختبار المثلث</title><desc id="description">ثلاث عينات مرمزة، اثنتان متطابقتان وواحدة مختلفة، ولا يحدد الرسم العينة المختلفة.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217f81"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f8"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient></defs><rect width="900" height="460" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="450" y="48" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="28" font-weight="700" fill="#17344d">منطق اختبار المثلث</text><path d="M145,164 L161,259 Q210,279 259,259 L275,164 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="210" cy="164" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="210" y="227" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">583</text><path d="M385,164 L401,259 Q450,279 499,259 L515,164 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="450" cy="164" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="450" y="227" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">126</text><path d="M625,164 L641,259 Q690,279 739,259 L755,164 Z" fill="#fff" stroke="#b7c9d5" stroke-width="3"/><ellipse cx="690" cy="164" rx="65" ry="18" fill="#c69461" stroke="#b7c9d5" stroke-width="3"/><text x="690" y="227" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="700" fill="#17344d">749</text><text x="450" y="108" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#607484">ثلاث عينات · اثنتان متطابقتان · واحدة مختلفة</text><rect x="100" y="308" width="700" height="87" rx="18" fill="#fff" stroke="#d7e3ea" stroke-width="2"/><text x="450" y="345" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="700" fill="#17344d">المهمة: حدد العينة المختلفة</text><text x="450" y="378" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="20" font-weight="500" fill="#607484">لا يحدد الاختبار أي منتج أفضل أو أكثر قبولًا</text></g></svg>
